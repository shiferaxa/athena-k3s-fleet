apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 10m
  chart:
    spec:
      chart: headlamp
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  values:
    serviceAccount:
      create: true
      name: headlamp

    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

    ingress:
      enabled: false
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.headlamp.svc.cluster.local:4180/oauth2/auth"
        nginx.ingress.kubernetes.io/auth-signin: "https://dashboard.amha.dev/oauth2/start?rd=$escaped_request_uri"
        nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email, X-Auth-Request-User"
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      hosts:
        - host: dashboard.amha.dev
          paths:
            - path: /
              pathType: Prefix
      # tls:
      #   - hosts: [ "dashboard.amha.dev" ]
      #     secretName: dashboard-tls
