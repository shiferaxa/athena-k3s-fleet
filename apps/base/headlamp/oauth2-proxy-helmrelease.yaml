apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: headlamp
spec:
  interval: 10m
  chart:
    spec:
      chart: oauth2-proxy
      version: 7.x.x
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: flux-system
  values:
    extraEnv:
    - name: OAUTH2_PROXY_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: oauth2-proxy-secret
          key: client-id
    - name: OAUTH2_PROXY_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: oauth2-proxy-secret
          key: client-secret
    - name: OAUTH2_PROXY_COOKIE_SECRET
      valueFrom:
        secretKeyRef:
          name: oauth2-proxy-secret
          key: cookie-secret
    extraArgs:
      provider: github
      email-domain: "*"
      cookie-secure: "true"
      redirect-url: "https://dashboard.amha.dev/oauth2/callback"
      upstream: "static://200"
    service:
      portNumber: 4180
    ingress:
      enabled: true
      className: nginx
      path: /oauth2
      pathType: Prefix
      hosts:
      - dashboard.amha.dev
