apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: headlamp
  # === FIX: RESOLVES HELM PATCH CONFLICT ERROR ===
  annotations: 
    # Force replacement of the resource before upgrade to resolve the $setElementOrder list error
    helm.sh/hook-delete-policy: before-hook-creation
    kustomize.toolkit.fluxcd.io/reconcile: "changed"
spec:
  interval: 10m
  chart:
    spec:
      chart: oauth2-proxy
      version: 7.x.x
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: flux-system
  values:
    # Map the Secret keys to the env vars oauth2-proxy expects
    extraEnv:
      - name: OAUTH2_PROXY_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: client-id
      - name: OAUTH2_PROXY_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: client-secret
      - name: OAUTH2_PROXY_COOKIE_SECRET
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: cookie-secret

    extraArgs:
      provider: github
      email-domain: "*"
      cookie-secure: "true"
      redirect-url: "https://dashboard.amha.dev/oauth2/callback"
      upstream: "static://200" # auth-only mode
      
      # === FIXES FOR HTTPS/CLOUDFLARE/GITHUB ===
      # 1. Trust headers from Ingress/Tunnel (e.g., X-Forwarded-Proto)
      set-xauthrequest: true 
      
      # 2. CRITICAL FIX: Forces proxy to generate all redirects/cookies using HTTPS, 
      #    solving the GitHub 404/redirect errors (protocol mismatch).
      upstream-https: true
      
      # 3. Explicitly setting the modern GitHub endpoints (Prevents initial login 404)
      login-url: "https://github.com/login/oauth/authorize"
      redeem-url: "https://github.com/login/oauth/access_token"

    service:
      portNumber: 4180

    ingress:
      enabled: true
      className: nginx
      path: /oauth2
      pathType: Prefix
      hosts:
        - dashboard.amha.dev
